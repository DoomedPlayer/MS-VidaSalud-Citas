spring.application.name=vsCitas

spring.datasource.url=jdbc:mysql://mysql-db:3306/appointments_db
spring.datasource.username=appointments_user
spring.datasource.password=appointments_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.kafka.bootstrap-servers=ec2-kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer